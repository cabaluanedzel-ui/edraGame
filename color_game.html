<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edra Game - Color Memory Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="color_game.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="app-container">
        <header class="game-header glass-panel">
            <h1>Edra Game</h1>
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-label">Moves</span>
                    <span class="stat-value" id="moves-count">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
            </div>
            <button class="btn-primary" id="restart-btn">Restart Game</button>
        </header>

        <main class="game-board-container glass-panel">
            <div class="grid" id="game-grid">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </main>
    </div>

    <!-- Victory Modal -->
    <div class="modal-overlay hidden" id="victory-modal">
        <div class="modal-content glass-panel">
            <h2>You Won! 🎉</h2>
            <div class="final-stats">
                <p>Time: <span id="final-time">00:00</span></p>
                <p>Moves: <span id="final-moves">0</span></p>
            </div>
            <button class="btn-primary" id="play-again-btn">Play Again</button>
        </div>
    </div>

    <script src="color_game.js"></script>
</body>
</html>
